# The three verifiers and their shared conformance fixtures, on every push and pull request.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifiable-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./packages/verifiable-receipts-py pytest
      - run: python -m pytest packages/verifiable-receipts-py/tests
      - run: python -m pytest packages/verifiable-receipts/conformance/conformance.py
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifiable-receipts-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
