# The three verifiers, their shared conformance fixtures and a cross-language
# sign-and-verify round trip, on every push and pull request.
#
# Actions are pinned to full commit SHAs (the tag each SHA had when pinned is
# in the comment). The token is read-only and checkout does not keep it.
name: test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read # check out the code
# Keyed on the calling workflow too, so a tag push's own run never cancels
# the run that release.yml makes; only pull request runs are superseded.
concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # the supported LTS lines; engines starts at 22
    defaults:
      run:
        working-directory: packages/verifiable-receipts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "./packages/verifiable-receipts-py[test]" ruff==0.17.2
      - run: ruff check .
      - run: python -m pytest packages/verifiable-receipts-py/tests
      - run: python -m pytest packages/verifiable-receipts/conformance/conformance.py
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.27"] # the go.mod minimum and the newest supported release
    defaults:
      run:
        working-directory: packages/verifiable-receipts-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  roundtrip:
    name: Round trip
    # Signs body.json with the Python signer and the sign CLI, and a
    # Guardian attestation with runGuardian, under an Ed25519 key made in
    # the job; verifies each in Python, Go and node (conformance/roundtrip/).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - run: npm ci
        working-directory: packages/verifiable-receipts
      - run: pip install ./packages/verifiable-receipts-py
      - run: bash packages/verifiable-receipts/conformance/roundtrip/run.sh
