# The three verifiers, their shared conformance fixtures and a cross-language
# sign-and-verify round trip, on every push and pull request.
#
# Actions are pinned to full commit SHAs (the tag each SHA had when pinned is
# in the comment). The token is read-only and checkout does not keep it.
name: test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read # check out the code
# Keyed on the calling workflow too, so a tag push's own run never cancels
# the run that release.yml makes; only pull request runs are superseded.
concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # the supported LTS lines; engines starts at 22
    defaults:
      run:
        working-directory: packages/verifiable-receipts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r .github/tools/python-ci/requirements.txt
      - run: ruff check .
      - name: pytest, with the package read from the working tree
        env:
          PYTHONPATH: packages/verifiable-receipts-py
        run: python -m pytest packages/verifiable-receipts-py/tests packages/verifiable-receipts/conformance/conformance.py packages/verifiable-receipts/conformance/differential schemas .github/release
  release-tools:
    # The release scripts' own tests, and the Python SBOM's lockfile.
    name: Release tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r .github/tools/python-ci/requirements.txt
      - name: build.sh's clean-tree check and file-mode reset
        run: .github/release/test_build.sh
      - name: verify.sh, the publish jobs' guard
        run: .github/release/test_verify.sh
      - name: runtime.txt is what pyproject.toml compiles to
        run: .github/tools/python-sbom/check_runtime.sh
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.27"] # the go.mod minimum and the newest supported release
    defaults:
      run:
        working-directory: packages/verifiable-receipts-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  roundtrip:
    name: Round trip
    # Signs body.json with the Python signer and the sign CLI, and a
    # Guardian attestation with runGuardian, under an Ed25519 key made in
    # the job; verifies each in Python, Go and node (conformance/roundtrip/).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: npm ci
        working-directory: packages/verifiable-receipts
      - run: python -m pip install --require-hashes --no-deps -r .github/tools/python-ci/requirements.txt
      - run: bash packages/verifiable-receipts/conformance/roundtrip/run.sh
