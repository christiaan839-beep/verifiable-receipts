# Publishes one package from its release tag:
#   js-vX.Y.Z                              npm  @sovereignos/verifiable-receipts
#   py-vX.Y.Z                              PyPI sovereign-matrix-verifiable-receipts
#   packages/verifiable-receipts-go/vX.Y.Z the Go module (fetched through proxy.golang.org)
# The tag must match the package's version and must point at a commit on
# main. The test workflow runs first. The reusable build workflow
# (build.yml) builds the files reproducibly, with a CycloneDX SBOM for each,
# in a job that cannot sign, then signs SLSA build provenance and SBOM
# attestations for them in a job that runs no repository code, after a
# maintainer approves the "release" environment (SLSA Build L3: the signer
# is build.yml, which this workflow cannot change). Every publish job
# checks the exact files it uploads against those attestations (signed by
# build.yml, from this tag and commit) and against the digests build.yml
# output, with .github/release/verify.sh, and stops if any check fails.
# Publishing uses trusted publishing (OIDC, no stored tokens) from the
# protected "release" environment. npm uploads are staged (npm stage
# publish) and go live only when a maintainer approves them with 2FA. The
# GitHub release gets the files, SBOMs, attestation bundles and SHA256SUMS,
# after they verify. RELEASING.md has the steps; release-dry-run.yml runs
# all of this except publishing.
#
# Actions are pinned to full commit SHAs (the tag each SHA had when pinned
# is in the comment). Every job starts with no token permissions and asks
# only for what it uses.
name: release
on:
  push:
    tags:
      - "js-v*"
      - "py-v*"
      - "packages/verifiable-receipts-go/v*"
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the manifests and main's history
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      node-version: ${{ steps.plan.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: The tag names a package version that matches its manifest and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            js-v*) kind=js; version="${TAG#js-v}"
              have=$(node -p "require('./packages/verifiable-receipts/package.json').version") ;;
            py-v*) kind=py; version="${TAG#py-v}"
              have=$(python3 -c "import tomllib; print(tomllib.load(open('packages/verifiable-receipts-py/pyproject.toml','rb'))['project']['version'])") ;;
            packages/verifiable-receipts-go/v*) kind=go; version="${TAG#packages/verifiable-receipts-go/v}"
              have="$version" ;;
            *) echo "::error::unrecognised release tag"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z"; exit 1
          fi
          if [ "$have" != "$version" ]; then
            echo "::error::tag says $version, the manifest says $have"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::the tagged commit is not on main"; exit 1; }
          {
            echo "kind=$kind"
            echo "version=$version"
            echo "node-version=$(cat .github/release/node-version)"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: plan
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read # check out the code to test

  build:
    # The reusable release build (SLSA Build L3): builds the package's files
    # and an SBOM for each, and signs a provenance and an SBOM attestation
    # for each file (after approval of the release environment). Uploads
    # them as the artifact dist-<kind>, and outputs their digests.
    name: Build
    needs: [plan, test]
    uses: $/.github/workflows/build.yml
    with:
      package: ${{ needs.plan.outputs.kind }}
      go-version: ${{ needs.plan.outputs.kind == 'go' && format('v{0}', needs.plan.outputs.version) || '' }}
    permissions:
      contents: read # check out the code
      id-token: write # sign the attestations (Sigstore)
      attestations: write # store the attestations on GitHub

  publish-npm:
    # Gated on a repository variable until the package exists on npm and has
    # this workflow as its trusted publisher (RELEASING.md, first release).
    name: Stage on npm
    needs: [plan, build]
    if: needs.plan.outputs.kind == 'js' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/@sovereignos/verifiable-receipts
    permissions:
      contents: read # check out verify.sh
      id-token: write # npm trusted publishing (OIDC) and npm provenance
    steps:
      # The release build's Node, so npm packs the same bytes it packed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The npm that ships with Node 24 (11.19 since Node 24.21) stages
      # packages; check it is at least 11.15, the first that can.
      - name: npm supports staged publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$v" \
            || { echo "::error::npm $v cannot stage packages; it needs 11.15 or later"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-js
          path: dist
      # verify.sh only, from the tagged commit: it runs gh and jq, nothing
      # from a registry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: vr
          sparse-checkout: .github/release
          sparse-checkout-cone-mode: false
      - name: Verify the files against the attestations and build.yml's digests
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.build.outputs.sha256sums }}
          DIR: dist
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          vr/.github/release/verify.sh --expect "$RUNNER_TEMP/expected.sha256" \
            --source-digest "$GITHUB_SHA" "$DIR" "$GITHUB_REF"
      - name: Stage the attested tarball's contents for approval on npm
        run: |
          set -euo pipefail
          tgz=(dist/*.tgz)
          want="sha512-$(openssl dgst -sha512 -binary "${tgz[0]}" | base64 -w0)"
          tar -xzf "${tgz[0]}"
          cd package
          # npm repacks what it publishes. The build is reproducible, so the
          # repacked tarball must be the attested one, byte for byte.
          have=$(npm pack --dry-run --json --ignore-scripts | node -p 'JSON.parse(require("fs").readFileSync(0))[0].integrity')
          if [ "$have" != "$want" ]; then
            echo "::error::npm would publish $have, not the attested tarball $want"; exit 1
          fi
          npm stage publish --ignore-scripts

  publish-pypi:
    name: Publish on PyPI
    needs: [plan, build]
    if: needs.plan.outputs.kind == 'py'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/sovereign-matrix-verifiable-receipts/
    permissions:
      contents: read # check out verify.sh
      id-token: write # PyPI trusted publishing (OIDC) and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-py
          path: built
      # verify.sh only, from the tagged commit: it runs gh and jq, nothing
      # from a registry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: vr
          sparse-checkout: .github/release
          sparse-checkout-cone-mode: false
      - name: Verify the files against the attestations and build.yml's digests
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.build.outputs.sha256sums }}
          DIR: built
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          vr/.github/release/verify.sh --expect "$RUNNER_TEMP/expected.sha256" \
            --source-digest "$GITHUB_SHA" "$DIR" "$GITHUB_REF"
      # PyPI takes the sdist and the wheel only, not the SBOMs and bundles:
      # exactly the files verified above.
      - run: mkdir dist && cp built/*.tar.gz built/*.whl dist/ && ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  proxy-go:
    name: Record the Go module version
    needs: [plan, build]
    if: needs.plan.outputs.kind == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out verify.sh and the Go version
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-go
          path: ${{ runner.temp }}/built
      # verify.sh only, from the tagged commit: it runs gh and jq, nothing
      # from a registry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: vr
          sparse-checkout: .github/release
          sparse-checkout-cone-mode: false
      - name: Verify the files against the attestations and build.yml's digests
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.build.outputs.sha256sums }}
          DIR: ${{ runner.temp }}/built
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          vr/.github/release/verify.sh --expect "$RUNNER_TEMP/expected.sha256" \
            --source-digest "$GITHUB_SHA" "$DIR" "$GITHUB_REF"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vr/.github/release/go-version
          cache: false
      - name: Fetch the module version through the public proxy and checksum database
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          module=github.com/christiaan839-beep/verifiable-receipts/packages/verifiable-receipts-go
          cd "$RUNNER_TEMP"
          go mod init release-check
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go get "$module@v${VERSION}"
          # What the proxy serves (and go.sum hashes) is the attested zip.
          zip=$(GOPROXY=https://proxy.golang.org go mod download -json "$module@v${VERSION}" | jq -r .Zip)
          cmp "$zip" "built/verifiable-receipts-go-v${VERSION}.zip"
          echo "proxy.golang.org serves the attested zip: $(sha256sum < "$zip")"

  github-release:
    name: Create the GitHub release
    needs: [plan, build, publish-npm, publish-pypi, proxy-go]
    if: >-
      always() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ needs.plan.outputs.kind }}
          path: assets
      # The files, an SBOM for each (FILE.cdx.json), the provenance and SBOM
      # attestation bundles (FILE.provenance.sigstore.json,
      # FILE.sbom.sigstore.json) and SHA256SUMS over all of them.
      - name: Write SHA256SUMS
        run: cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Verify the files as a user would
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          .github/release/verify.sh --expect "$RUNNER_TEMP/expected.sha256" \
            --source-digest "$GITHUB_SHA" assets "$GITHUB_REF"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          KIND: ${{ needs.plan.outputs.kind }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          case "$KIND" in
            js) changelog=packages/verifiable-receipts/CHANGELOG.md ;;
            py) changelog=packages/verifiable-receipts-py/CHANGELOG.md ;;
            go) changelog=packages/verifiable-receipts-go/CHANGELOG.md ;;
          esac
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' "$changelog" > "$notes"
          args=(--verify-tag --title "$TAG")
          if [ -s "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}" assets/*
