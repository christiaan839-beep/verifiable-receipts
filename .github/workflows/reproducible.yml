# Reproducible builds: builds each package's release files twice, with the
# release build script (.github/release/build.sh), and fails if any byte
# differs. Runs on every pull request, so reproducibility cannot regress,
# and on main.
#
# What the second build changes, against the first:
#   - the runner image (ubuntu-22.04, not 24.04) and the start time (two
#     minutes later, so a clock in the output would show);
#   - the checkout path (a deeper one);
#   - the user (another account, another uid and gid) and HOME (an empty
#     one, so no npm, pip or Go build cache is shared);
#   - the order in which directories list their files (the checkout is read
#     through disorderfs, which shuffles every directory listing);
#   - the files' modes (group and other bits cleared, as a clone made under
#     umask 077 has them) and their mtimes (every file and directory under
#     packages/ is set to 2001-02-03);
#   - the umask (077), TZ and LANG it calls build.sh with.
# build.sh resets the last three (umask 022, TZ=UTC, LC_ALL=C) and the
# package's file modes (from the git index) itself, so those test that
# reset rather than vary what the tools see. Not varied: the toolchain
# (pinned, and the bytes depend on it), the CPU architecture (both x86-64)
# and the kernel.
#
# Actions are pinned to full commit SHAs (the tag in the comment). The token
# is read-only and checkout does not keep it.
name: reproducible
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build ${{ matrix.package }} (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        package: [js, py, go]
        build: [first, second]
        include:
          - build: first
            runner: ubuntu-24.04
            path: src
          - build: second
            runner: ubuntu-22.04
            path: a/much/deeper/checkout
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - name: Start later than the first build
        if: matrix.build == 'second'
        run: sleep 120
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the Go zip's pseudo-version needs the tags
          path: ${{ matrix.path }}
      - uses: $/.github/actions/release-toolchain
        with:
          package: ${{ matrix.package }}
          root: ${{ matrix.path }}
      - name: Build
        if: matrix.build == 'first'
        working-directory: ${{ matrix.path }}
        env:
          PACKAGE: ${{ matrix.package }}
          OUT: ${{ runner.temp }}/out-first
        run: .github/release/build.sh "$PACKAGE" "$OUT"
      # The second build runs as another user, from a copy under /srv (the
      # runner's home is not that user's to read), read through disorderfs
      # mounted at /srv/<the deeper checkout path>.
      - name: Build as another user, with other modes and mtimes, through a shuffled file system
        if: matrix.build == 'second'
        env:
          PACKAGE: ${{ matrix.package }}
          CHECKOUT: ${{ matrix.path }}
        run: |
          set -euo pipefail
          src=/srv/source mnt=/srv/$CHECKOUT out=/srv/out-second
          sudo apt-get update -q
          sudo apt-get install -y -q disorderfs
          sudo useradd --create-home --uid 4321 --user-group vrbuild
          sudo cp -a "$CHECKOUT" "$src"
          sudo chmod -R go-rwx "$src"
          sudo find "$src/packages" -exec touch -d '2001-02-03 04:05:06' {} +
          sudo chown -R vrbuild:vrbuild "$src"
          sudo install -d -o vrbuild -g vrbuild "$mnt" "$out"
          sudo -u vrbuild disorderfs --shuffle-dirents=yes "$src" "$mnt"
          # Two reads of the same directory list it in different orders, or
          # the build would not be the shuffled one this job claims.
          d=$mnt/packages/verifiable-receipts-py/tests
          if [ "$(sudo -u vrbuild ls -f "$d")" = "$(sudo -u vrbuild ls -f "$d")" ]; then
            echo "::error::disorderfs listed $d in the same order twice; the listing is not shuffled"
            exit 1
          fi
          sudo -u vrbuild env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            HOME=/home/vrbuild TZ=Pacific/Kiritimati LANG=de_DE.UTF-8 PACKAGE="$PACKAGE" OUT="$out" MNT="$mnt" \
            bash -c 'umask 077 && cd "$MNT" && id && .github/release/build.sh "$PACKAGE" "$OUT"'
          sudo fusermount -u "$mnt"
          mkdir "$RUNNER_TEMP/out-second"
          sudo cp "$out"/* "$RUNNER_TEMP/out-second/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out-second"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.package }}-${{ matrix.build }}
          path: ${{ runner.temp }}/out-${{ matrix.build }}/
          if-no-files-found: error

  compare:
    name: Compare ${{ matrix.package }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package: [js, py, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-${{ matrix.package }}-*
          path: ${{ runner.temp }}/repro
      - name: The two builds are byte-identical
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro"
          (cd "repro-$PACKAGE-first" && sha256sum -- *) > first.sha256
          (cd "repro-$PACKAGE-second" && sha256sum -- *) > second.sha256
          {
            echo "### $PACKAGE"
            echo '```'
            cat first.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! diff -u first.sha256 second.sha256; then
            echo "::error::the $PACKAGE release files differ between the two builds"
            for f in "repro-$PACKAGE-first"/*; do
              cmp "$f" "repro-$PACKAGE-second/$(basename "$f")" || true
            done
            exit 1
          fi
          echo "identical:"; cat first.sha256
