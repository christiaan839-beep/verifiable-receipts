# Weekly updates, grouped per ecosystem. A release must be 14 days old
# before Dependabot proposes it, so a compromised release has time to be
# caught and pulled first. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/verifiable-receipts
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # The types follow the oldest Node the package supports (engines), so
      # a newer Node's APIs fail the type check instead of a user's code.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
  - package-ecosystem: pip
    directory: /packages/verifiable-receipts-py
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/verifiable-receipts-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /.github/tools/npm-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: pip
    directory: /.github/tools/python-build
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-build:
        patterns: ["*"]
