# Weekly updates, grouped per ecosystem. Not covered: the release
# toolchain versions in .github/release/*-version (node, python, go), which
# RELEASING.md says how to bump. A release must be 14 days old
# before Dependabot proposes it, so a compromised release has time to be
# caught and pulled first. Security updates are not delayed.
version: 2
updates:
  # The workflows (/ covers .github/workflows) and the composite actions in
  # .github/actions/<name>/action.yml.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/verifiable-receipts
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # The types follow the oldest Node the package supports (engines), so
      # a newer Node's APIs fail the type check instead of a user's code.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
  - package-ecosystem: pip
    directory: /packages/verifiable-receipts-py
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/verifiable-receipts-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: pip
    directory: /.github/tools/python-ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-ci:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/tools/python-build
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-build:
        patterns: ["*"]
  # The SBOM generator for the Python release files, and the runtime
  # dependencies the Python SBOM lists (runtime.txt, from pyproject.toml).
  - package-ecosystem: pip
    directory: /.github/tools/python-sbom
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-sbom:
        patterns: ["*"]
  # golang.org/x/mod, which makes the Go module zip for a release.
  - package-ecosystem: gomod
    directory: /.github/release/gomodzip
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
