[project]
name = "sovereign-matrix-verifiable-receipts"
version = "0.2.0"
description = "Python signer and verifier for VAOS v2 receipts (Ed25519), and RFC 9162 inclusion-proof verifier"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sovereign Matrix", email = "sovereign.systems007@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0"
]
keywords = ["vaos", "verifiable-receipts", "ed25519", "transparency-log", "rfc9162", "ai-audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://sovereignmatrix.agency"
Source = "https://github.com/christiaan839-beep/verifiable-receipts/tree/main/packages/verifiable-receipts-py"
Spec = "https://github.com/christiaan839-beep/verifiable-receipts/blob/main/docs/specs/vaos-2.0.md"
Security = "https://github.com/christiaan839-beep/verifiable-receipts/blob/main/packages/verifiable-receipts/SPEC.md#contact"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sovereign_matrix"]
